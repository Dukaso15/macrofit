<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MacroFit</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="description" content="Diario de comidas y macros con lectura de etiquetas nutricionales.">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171C23" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MacroFit">

<link rel="stylesheet" href="css/app.css">

<script>
  // Aplica el tema guardado antes del primer pintado para evitar el parpadeo.
  try {
    var t = localStorage.getItem('macrofit.theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>

<div id="app">
  <div class="empty" style="padding-top:38vh">
    <div class="ico">&#127859;</div>
    <div>Cargando…</div>
  </div>
</div>

<script type="module" src="js/app.js"></script>

<noscript>
  <div style="padding:24px;text-align:center">
    MacroFit necesita JavaScript para funcionar.
  </div>
</noscript>

</body>
</html>
