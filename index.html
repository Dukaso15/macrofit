<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MacroFit</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="description" content="Diario de comidas y macros con lectura de etiquetas nutricionales.">

<!--
  La app no habla con ningun servidor: todo lo que necesita esta en su propio
  origen. Esta politica lo hace explicito, de modo que si alguna vez se colara
  texto malicioso en la interfaz, el navegador se negaria a ejecutarlo.

  - script-src 'self': nada de scripts incrustados en la pagina ni de terceros.
  - connect-src 'self': la app no puede enviar tus datos a ninguna parte.
  - style-src admite 'unsafe-inline' porque la interfaz usa atributos style=".
    Es la unica concesion, y afecta a estilos, no a codigo ejecutable.
  - frame-ancestors no funciona en una etiqueta meta (solo como cabecera HTTP,
    que GitHub Pages no deja poner); se cubre desde js/theme-boot.js.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' blob:;
  font-src 'self';
  connect-src 'self';
  manifest-src 'self';
  worker-src 'self';
  media-src 'none';
  object-src 'none';
  frame-src 'none';
  child-src 'none';
  base-uri 'none';
  form-action 'none';
">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171C23" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MacroFit">

<link rel="stylesheet" href="css/app.css">

<script src="js/theme-boot.js"></script>
</head>
<body>

<div id="app">
  <div class="empty" style="padding-top:38vh">
    <div class="ico">&#127859;</div>
    <div>Cargando…</div>
  </div>
</div>

<script type="module" src="js/app.js"></script>

<noscript>

  </div>

</body>
</html>
